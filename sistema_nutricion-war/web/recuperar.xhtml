<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui"
                template="/plantillas/plantilla.xhtml">
    <ui:define name="titulo">Recuperar contraseña · NutriVida</ui:define>
    <ui:define name="notificaciones" />
    <ui:define name="content">
        <div class="acceso">
            <h:form id="frmRecuperar" styleClass="tarjeta tarjeta-acceso">
                <h1>Recuperar contraseña</h1>
                <p class="texto-ayuda">Escribe el correo con el que entras a NutriVida.</p>
                <p:messages id="mensajes" />
                <div class="campo">
                    <p:outputLabel for="correo" value="Correo" />
                    <p:inputText id="correo" value="#{recuperacionBean.correo}" required="true" maxlength="120"
                                 pt:autocomplete="email" pt:inputmode="email" requiredMessage="Escribe tu correo."
                                 validatorMessage="Escribe un correo válido.">
                        <f:validateRegex pattern="[^\s@]+@[^\s@]+\.[^\s@]+" />
                    </p:inputText>
                </div>
                <p:commandButton value="Enviar enlace" action="#{recuperacionBean.solicitar}" ajax="false"
                                 styleClass="btn-primario btn-bloque acceso-accion" />
                <h:link outcome="/acceso" value="Volver al acceso" styleClass="acceso-enlace" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
