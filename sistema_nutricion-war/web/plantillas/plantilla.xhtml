<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<!-- Plantilla pública: top / content / bottom -->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <f:view locale="es_MX">
    <ui:insert name="metadata" />
    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <h:outputStylesheet name="css/estilos.css" />
        <link rel="icon" href="#{request.contextPath}/resources/img/logo.svg" type="image/svg+xml" />
        <title><ui:insert name="titulo">Consultorio de Nutrición</ui:insert></title>
    </h:head>

    <h:body styleClass="publico">

        <div id="top">
            <ui:insert name="top">
                <div class="barra">
                    <h:link outcome="/index" styleClass="marca">
                        <h:graphicImage name="img/logo.svg" alt="" styleClass="marca-logo" />
                        <span>Nutri<strong>Vida</strong></span>
                    </h:link>
                    <nav class="nav-publica">
                        <h:link outcome="/index" value="Inicio" />
                        <h:link outcome="/acceso" value="Acceso nutriólogo" styleClass="nav-acceso" />
                    </nav>
                </div>
            </ui:insert>
        </div>

        <div id="content" class="center_content">
            <p:growl id="growl" showDetail="false" life="5000" />
            <ui:insert name="content">Content</ui:insert>
        </div>

        <div id="bottom">
            <ui:insert name="bottom">
                <div class="pie">
                    <span>NutriVida · Consultorio de nutrición</span>
                    <span>Lunes a sábado, 9:00 a 19:00</span>
                </div>
            </ui:insert>
        </div>

        <h:outputScript name="js/locale-es.js" />
    </h:body>
    </f:view>

</html>
