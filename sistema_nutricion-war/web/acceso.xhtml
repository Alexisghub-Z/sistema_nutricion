<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/plantillas/plantilla.xhtml">

    <ui:define name="titulo">Acceso · NutriVida</ui:define>

    <ui:define name="content">
        <div class="acceso">
            <h:form id="frmAcceso" styleClass="tarjeta tarjeta-acceso">
                <h:graphicImage name="img/logo.svg" alt="" styleClass="acceso-logo" />
                <h1>Acceso del nutriólogo</h1>
                <p:messages id="msgs" closable="true" />
                <div class="campo">
                    <p:outputLabel for="email" value="Correo" />
                    <p:inputText id="email" value="#{loginBean.email}" required="true"
                                 requiredMessage="Escribe tu correo." />
                </div>
                <div class="campo">
                    <p:outputLabel for="pass" value="Contraseña" />
                    <p:password id="pass" value="#{loginBean.password}" required="true"
                                requiredMessage="Escribe tu contraseña." />
                </div>
                <p:commandButton value="Entrar" action="#{loginBean.entrar}" ajax="false"
                                 icon="ui-icon-key" styleClass="btn-primario btn-bloque" />
                <p class="nota">Usuario de prueba: <code>admin@nutricion.com</code> / <code>admin123</code></p>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
