<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">
    <h:form id="frmPlanAlimenticio">
        <h:panelGroup rendered="#{empty expedienteBean.planesGuardados}" layout="block" styleClass="alerta-solo-lectura">
            Guarda primero la meta y los macros en Cálculo dietético.
        </h:panelGroup>
        <h:panelGroup rendered="#{not empty expedienteBean.planesGuardados}" layout="block" styleClass="acciones-form">
            <p:commandButton value="Generar borrador SMAE" action="#{expedienteBean.generarPlanAlimenticio}"
                             process="@this" update="@form :growl" styleClass="btn-primario" />
        </h:panelGroup>

        <h:panelGroup id="borradorAlimenticio" rendered="#{expedienteBean.borradorAlimenticio != null}" layout="block" styleClass="tarjeta">
            <h2>Borrador para revisión</h2>
            <ui:include src="/WEB-INF/fragmentos/resumen-plan-alimenticio.xhtml">
                <ui:param name="plan" value="#{expedienteBean.borradorAlimenticio}" />
                <ui:param name="tiempos" value="#{expedienteBean.tiemposComida}" />
                <ui:param name="mostrarMeta" value="#{true}" />
            </ui:include>
            <div class="plan-smae-revision">
                <h:selectBooleanCheckbox id="revisionAlimenticia" value="#{expedienteBean.revisionAlimenticiaConfirmada}" />
                <h:outputLabel for="revisionAlimenticia"
                               value="Revisé las porciones, las alergias y los riesgos de trazas o contacto cruzado." />
            </div>
            <div class="acciones-form">
                <p:commandButton value="Aprobar plan" action="#{expedienteBean.aprobarPlanAlimenticio}"
                                 process="@form" update="@form :growl" styleClass="btn-primario" />
                <p:commandButton value="Descartar borrador" action="#{expedienteBean.descartarBorradorAlimenticio}"
                                 process="@this" update="@form" styleClass="btn-secundario" />
            </div>
        </h:panelGroup>

        <h:panelGroup id="aprobadoAlimenticio" rendered="#{expedienteBean.planAlimenticioAprobado != null}"
                      layout="block" styleClass="tarjeta">
            <h2>Último plan aprobado</h2>
            <p>
                <h:outputText value="Aprobado el " />
                <h:outputText value="#{expedienteBean.planAlimenticioAprobado.fechaAprobacion}">
                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" locale="es_MX" />
                </h:outputText>
                <h:panelGroup rendered="#{expedienteBean.planAlimenticioAprobado.fechaEntrega != null}">
                    <h:outputText value=" · Entregado al portal el " />
                    <h:outputText value="#{expedienteBean.planAlimenticioAprobado.fechaEntrega}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" locale="es_MX" />
                    </h:outputText>
                </h:panelGroup>
            </p>
            <ui:include src="/WEB-INF/fragmentos/resumen-plan-alimenticio.xhtml">
                <ui:param name="plan" value="#{expedienteBean.planAlimenticioAprobado}" />
                <ui:param name="tiempos" value="#{expedienteBean.tiemposComida}" />
                <ui:param name="mostrarMeta" value="#{true}" />
            </ui:include>
            <h:panelGroup rendered="#{expedienteBean.planAlimenticioAprobado.fechaEntrega == null}"
                          layout="block" styleClass="acciones-form">
                <p:commandButton value="Entregar al portal" action="#{expedienteBean.entregarPlanAlimenticio}"
                                 process="@this" update="@form :growl" styleClass="btn-primario" />
            </h:panelGroup>
        </h:panelGroup>
    </h:form>
</ui:composition>
